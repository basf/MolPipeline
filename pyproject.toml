[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
dynamic = ["version"]
name = "molpipeline"
authors = [
    {name = "Christian W. Feldmann"},
    {name = "Jennifer Hemmerich"},
    {name = "Jochen Sieg"},
    {name = "Kyriakos Soulios"}
]
description = "Integration of rdkit functionality into sklearn pipelines."
readme = "README.md"
dependencies = [
    "crepes>=0.8.0",
    "joblib>=1.3.0",
    "loguru>=0.7.3",
    "matplotlib>=3.10.1",
    "numba>=0.47.0",
    "numpy>=1.26.4",
    "pandas>=2.2.3",
    "rdkit>=2023.9.1",
    "scikit-learn>=1.8.0",
    "scipy>=1.15.2",
    "shap>=0.51.0",
    "typing-extensions>=4.13.1",
]

[project.optional-dependencies]
chemprop = [
    "chemprop>=2.2.0,<2.4.0",
    "dvc>=3.64.1",
    "lightning>=2.5.1",
    "requests>=2.32.5",
]
notebooks = [
    "jupyterlab>=4.4.0",
    "seaborn>=0.13.2",
]

[tool.bandit]
exclude_dirs = [".venv"]

[tool.ruff.lint]
preview = true
select =  [
    "A",     # flake8-buildins
    "ANN",   # flake8-annotations
    "ARG",   # flake8-unused-arguments
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "COM",   # flake8-commas
    "D",     # pydocstyle
    "DOC",   # pydoclint
    "E",     # pycodestyle - errors
    "ERA",   # eradicate
    "F",     # pyflakes
    "FA",    # flake8-funny-annotations
    "FIX",   # flake8-fixme
    "FLY",   # flake8-flynt
    "FURB",  # refurb
    "I",     # isort
    "ISC",   # flake8-implicit-str-concat
    "ICN",   # flake8-import-conventions
    "INP",   # flake8-no-pep420
    "N",     # pep8-naming
    "NPY",   # numpy-specific rules
    "PD",    # pandas-vet
    "PERF",  # perflint
    "PGH",   # pygrep-hook
    "PIE",   # flake8-pie
    "PL",    # pylint
    "PTH",   # flake8-use-pathlib
    "PYI",   # flake8-pyi
    "Q",     # flake8-quotes
    "RET",   # flake8-return
    "RUF",   # ruff specific rules
    "S",     # flake8-bandit
    "SIM",   # flake8-simplify
    "SLF",   # flake8-self
    "TC",    # flake8-type-checking
    "TD",    # flake8-todo
    "T10",   # flake8-debugger
    "T20",   # flake8-print
    "TID",   # flake8-tidy-imports
    "UP",    # pyupgrade
    "W",     # pycodestyle - warnings
]
ignore = [
    "any-type",  #  Allow  typing.Any
    "incorrect-blank-line-before-class", # incorrect-blank-line-before-class
    "multi-line-summary-second-line", # blank-line-before-class-docstring
    "repeated-append", # Use `xxx.extend(...)` instead of repeatedly calling `xxx.append()  # TO REMOVE
    "camelcase-imported-as-lowercase",  #  Camelcase `rdFingerprintGenerator` imported as lowercase `rdkit_fp`  # TO REMOVE
    "blanket-type-ignore",  # Blanket type ignore for types
    "try-except-in-loop",  # `try`-`except` within a loop incurs performance overhead  # TO REMOVE
    "manual-list-comprehension", # Use a list comprehension to create a transformed list  # TO REMOVE
    "compare-to-empty-string", # `rest == ""` can be simplified to `not rest` as an empty string is falsey  # TO REMOVE
    "too-many-branches", # Too many branches (19 > 12)  # TO REMOVE
    "too-many-arguments", # too-many-arguments
    "too-many-locals", # too-many-locals    # TO REMOVE
    "magic-value-comparison", # Magic value used in comparison  # TO REMOVE
    "import-private-name", # Private name import  # TO REMOVE
    "too-many-positional-arguments", # too-many-positional-arguments   # TO REMOVE
    "no-self-use", #  could be a function, class method, or static method # TO REMOVE
    "redefined-loop-name", # Redefined loop variable
    "bad-dunder-method-name", #  Dunder method `xxxx` has no special meaning  # TO REMOVE
    "builtin-open",  # `open()` should be replaced by `Path.open()`  # TO REMOVE
    "path-constructor-current-directory",  # Do not pass the current directory explicitly to `Path`  # TO REMOVE
    "unsupported-method-call-on-all",  # Calling `.append()` on `__all__` may not be supported by all type checkers # TO REMOVE
    "collection-literal-concatenation",  # Consider iterable unpacking instead of concatenation  # TO REMOVE
    "mutable-class-default",  # Mutable class attributes should be annotated with `typing.ClassVar`  # TO REMOVE
    "non-empty-init-module",  # `__init__` module should only contain docstrings and re-exports
    "unused-noqa",  #  Unused noqa  # TO REMOVE
    "assert",   # Use of `assert` detected  # TO REMOVE
    "suspicious-non-cryptographic-random-usage",  #  suspicious-non-cryptographic-random-usage
]
 [tool.ruff.lint.per-file-ignores]
 "*.ipynb" = [
     "assert",
     "line-too-long",
     "magic-value-comparison",
     "await-outside-async",
     "yield-outside-function",
     "print"
 ]
 "test_*" = [
     "assert",
     "suspicious-subprocess-import",
     "subprocess-without-shell-equals-true",
     "start-process-with-partial-path",
     "private-member-access",  # Private member accessed
 ]

[tool.ruff.lint.pylint]
max-positional-args = 10

[tool.pyright]
reportAbstractUsage = "warning"
reportAssignmentType = "warning"
reportAttributeAccessIssue = "warning"
reportArgumentType = "warning"
reportCallIssue = "warning"
reportGeneralTypeIssues = "warning"
reportIncompatibleMethodOverride = "warning"
reportIncompatibleVariableOverride = "error"
reportInvalidTypeForm = "warning"
reportIndexIssue = "warning"
reportMissingImports = "error"
reportMissingTypeStubs = "warning"
reportOptionalMemberAccess = "warning"
reportOptionalSubscript = "warning"
reportOverlappingOverload = "warning"
reportPossiblyUnboundVariable = "warning"
reportPrivateImportUsage = "warning"
reportRedeclaration = "warning"
reportReturnType = "warning"
reportUnhashable = "error"
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"

[tool.setuptools.dynamic]
version = {attr = "molpipeline.__version__"}


[tool.setuptools.packages.find]
exclude = ["tests", "docs"]

[tool.setuptools.package-data]
"molpipeline" = ["py.typed"]

[dependency-groups]
dev = [
    "bandit>=1.8.3",
    "chemprop>=2.3.1",
    "coverage>=7.8.0",
    "docsig>=0.79.0",
    "flake8>=7.2.0",
    "interrogate>=1.7.0",
    "mypy>=1.15.0",
    "pandas-stubs>=2.3.2.250926",
    "pre-commit>=4.2.0",
    "pydocstyle>=6.3.0",
    "pylint>=3.3.6",
    "pyright>=1.1.399",
    "ruff>=0.11.4",
    "scipy-stubs>=1.16.2.0",
    "types-colorama>=0.4.15.20250801",
    "types-decorator>=5.2.0.20250324",
    "types-defusedxml>=0.7.0.20250822",
    "types-jsonschema>=4.25.1.20250822",
    "types-networkx>=3.5.0.20251001",
    "types-pexpect>=4.9.0.20250916",
    "types-protobuf>=6.32.1.20250918",
    "types-pygments>=2.19.0.20250809",
    "types-pyyaml>=6.0.12.20250915",
    "types-regex>=2025.9.18.20250921",
    "types-requests>=2.32.4.20250913",
    "types-tabulate>=0.9.0.20241207",
    "types-tqdm>=4.67.0.20250809",
    "xgboost>=3.2.0",
]
