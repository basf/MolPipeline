# Builds the package when a GitHub release is published and uploads it to PyPI
# via Trusted Publishing (OIDC), without long-lived API tokens.
# For more information see: https://docs.pypi.org/trusted-publishers/

# All actions are pinned to full commit SHAs to protect against tag hijacking.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

# Serialise runs per release tag. Never cancel a publish that is already running,
# so a half-finished upload is not interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # Read the version string from molpipeline/__init__.py.
          # grep -P uses a Perl regex:
          #   ^__version__ = "   matches the start of the line and the assignment prefix
          #   \K                 resets the reported match start, so the prefix is not printed
          #   [^"]+              captures the version text up to the closing quote
          # "|| true" stops grep's exit status 1 (no match) from aborting the script,
          # so the empty-version check below can report a clear error instead.

          pkg_version=$(grep -oP '^__version__ = "\K[^"]+' molpipeline/__init__.py || true)

          if [ -z "$pkg_version" ]; then
            echo "::error::Could not read __version__ from molpipeline/__init__.py."
            exit 1
          fi
          if [ "${RELEASE_TAG#v}" != "$pkg_version" ]; then
            echo "::error::Release tag '$RELEASE_TAG' does not match package version '$pkg_version'."
            exit 1
          fi
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Build package
        run: python -m build
      - name: Check distributions
        run: python -m twine check --strict dist/*
      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dists
          path: dist/

  deploy:
    runs-on: ubuntu-latest
    needs:
      - release-build
    environment:
      name: pypi
      url: https://pypi.org/project/molpipeline/
    permissions:
      id-token: write # Required for PyPI Trusted Publishing
    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-dists
          path: dist/
      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
