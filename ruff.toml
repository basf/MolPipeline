 target-version = "py310"
 [lint]
 preview = true
select = [
    "A",     # flake8-buildins
    "ANN",   # flake8-annotations
    "ARG",   # flake8-unused-arguments
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "COM",   # flake8-commas
    "D",     # pydocstyle
    "DOC",   # pydoclint
    "E",     # pycodestyle - errors
    "ERA",   # eradicate
    "F",     # pyflakes
    "FA",    # flake8-funny-annotations
    "FIX",   # flake8-fixme
    "FLY",   # flake8-flynt
    "FURB",  # refurb
    "I",     # isort
    "ISC",   # flake8-implicit-str-concat
    "ICN",   # flake8-import-conventions
    "INP",   # flake8-no-pep420
    "N",     # pep8-naming
    "NPY",   # numpy-specific rules
    "PD",    # pandas-vet
    "PERF",  # perflint
    "PGH",   # pygrep-hook
    "PIE",   # flake8-pie
    "PL",    # pylint
    "PTH",   # flake8-use-pathlib
    "PYI",   # flake8-pyi
    "Q",     # flake8-quotes
    "RET",   # flake8-return
    "RUF",   # ruff specific rules
    "S",     # flake8-bandit
    "SIM",   # flake8-simplify
    "SLF",   # flake8-self
    "TC",    # flake8-type-checking
    "TD",    # flake8-todo
    "T10",   # flake8-debugger
    "T20",   # flake8-print
    "TID",   # flake8-tidy-imports
    "UP",    # pyupgrade
    "W",     # pycodestyle - warnings
]
ignore = [
    "any-type",  #  Allow  typing.Any
    "missing-return-type-special-method",  #  Missing return type annotation for special method
    "incorrect-blank-line-before-class", # 1 blank line required before class docstring
    "multi-line-summary-second-line", # blank-line-before-class-docstring
    "blanket-type-ignore",  # Blanket type ignore for types
    "redefined-loop-name", # Redefined loop variable
    "suspicious-non-cryptographic-random-usage",  #  suspicious-non-cryptographic-random-usage
]
 pylint = {max-positional-args=10, max-args=10}
 [lint.per-file-ignores]
 "*.ipynb" = [
     "assert",
     "line-too-long",
     "magic-value-comparison",
     "await-outside-async",
     "yield-outside-function",
     "print"
 ]
 "test*" = [
     "assert",
     "magic-value-comparison",
     "suspicious-subprocess-import",
     "subprocess-without-shell-equals-true",
     "start-process-with-partial-path",
     "private-member-access",
 ]
